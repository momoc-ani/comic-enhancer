<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>漫画增强器</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <header>
      <div class="brand">
        <span class="brand-mark">彩</span>
        <div>
          <div class="brand-title">
            <h1>漫画增强器</h1>
            <span id="extensionVersion"></span>
          </div>
          <p id="status" data-state="checking">正在检查服务</p>
        </div>
      </div>
      <label class="switch" title="启用漫画增强">
        <input id="enabled" type="checkbox">
        <span></span>
      </label>
    </header>

    <main>
      <div class="deployment-tabs" role="tablist" aria-label="部署位置">
        <button id="remoteTab" class="deployment-tab" type="button" role="tab" data-deployment="remote">远端模式</button>
        <button id="localTab" class="deployment-tab" type="button" role="tab" data-deployment="local">本地模式</button>
      </div>

      <label class="field">
        <span>运行方案</span>
        <select id="mode">
          <option value="fast">快速模式</option>
          <option value="quality">质量模式</option>
          <option value="manganinja">MangaNinja 实验档</option>
          <option value="cobra">Cobra 实验档</option>
          <option value="flux2">FLUX.2 实验档</option>
        </select>
      </label>

      <label class="field">
        <span id="apiBaseUrlLabel">远端服务地址</span>
        <input id="apiBaseUrl" type="url" spellcheck="false" placeholder="http://192.168.38.226:8765">
      </label>

      <label class="field">
        <span>推理服务 Token</span>
        <input id="apiToken" type="password" autocomplete="off" placeholder="COMIC_ENHANCER_TOKEN">
      </label>

      <section class="model-tier" aria-labelledby="modelTierLabel">
        <span id="modelTierLabel">当前模型档位</span>
        <strong id="modelTier">等待连接</strong>
        <p id="modelDetail" aria-live="polite">等待服务状态</p>
      </section>
    </main>

    <footer>
      <button id="save" type="button">保存并连接</button>
    </footer>
    <script type="module" src="popup.js"></script>
  </body>
</html>
