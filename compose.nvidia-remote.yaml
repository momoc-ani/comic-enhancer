services:
  comfyui:
    build:
      context: .
      dockerfile: Dockerfile.comfyui
    container_name: comic-enhancer-comfyui
    restart: unless-stopped
    gpus: all
    ipc: host
    environment:
      COBRA_MODEL_PATH: /root/sd/ComfyUI/models/cobra/JunhaoZhuang-Cobra
      COBRA_PIXART_MODEL_PATH: /root/sd/ComfyUI/models/cobra/PixArt-XL-2-1024-MS
      HF_ENDPOINT: https://hf-mirror.com
      PYTORCH_CUDA_ALLOC_CONF: expandable_segments:True
    ports:
      - "192.168.38.226:8192:8188"
    volumes:
      - ${COMFYUI_MODELS_ROOT:-/data1/models/ComfyUI/models}:/root/sd/ComfyUI/models:ro

  magiv2-analyzer:
    build:
      context: .
      dockerfile: Dockerfile.magiv2
    container_name: comic-enhancer-magiv2-analyzer
    restart: unless-stopped
    gpus: all
    ipc: host
    environment:
      MAGIV2_MODEL_PATH: /models/magiv2
      MAGIV2_REVISION: fbc890fec52977142e8ee00bfe26e9458b65517c
      MAGIV2_CLUSTER_MAX_DISTANCE: "0.50"
      MAGIV2_PROPAGATION_MAX_DISTANCE: "0.72"
      MAGIV2_SAM_CHECKPOINT: /models/sams/sam_vit_b_01ec64.pth
      MAGIV2_SAM_MODEL_TYPE: vit_b
      MAGIV2_SAM_MIN_SCORE: "0.85"
      PYTORCH_CUDA_ALLOC_CONF: expandable_segments:True
    expose:
      - "8770"
    volumes:
      - ${COMFYUI_MODELS_ROOT:-/data1/models/ComfyUI/models}:/models

  comic-enhancer-api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: comic-enhancer-api
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      COMIC_ENHANCER_BACKEND: comfyui
      COMIC_ENHANCER_TOKEN: ${COMIC_ENHANCER_TOKEN:?请在.env中设置COMIC_ENHANCER_TOKEN}
      COMIC_ENHANCER_ADMIN_TOKEN: ${COMIC_ENHANCER_ADMIN_TOKEN:?请在.env中设置管理Token}
      COMIC_ENHANCER_COMFYUI_URL: http://comfyui:8188
      COMIC_ENHANCER_COMFYUI_REFERENCE_ENABLED: ${COMIC_ENHANCER_COMFYUI_REFERENCE_ENABLED:-true}
      COMIC_ENHANCER_COMFYUI_REFERENCE_READY_FILE: /models/MangaNinjia/MangaNinjia.ready
      COMIC_ENHANCER_ANALYZER_ENABLED: ${COMIC_ENHANCER_ANALYZER_ENABLED:-true}
      COMIC_ENHANCER_ANALYZER_TIMEOUT: 300
      COMIC_ENHANCER_COMFYUI_COBRA_ENABLED: ${COMIC_ENHANCER_COMFYUI_COBRA_ENABLED:-false}
      COMIC_ENHANCER_WORKFLOW_COBRA: ${COMIC_ENHANCER_WORKFLOW_COBRA:-/app/workflows/cobra-colorize.json}
      COMIC_ENHANCER_COBRA_REFERENCE_LIMIT: ${COMIC_ENHANCER_COBRA_REFERENCE_LIMIT:-12}
      COMIC_ENHANCER_WORK_IDENTITY_INDEX: /app/config/work-identities.json
      COMIC_ENHANCER_ADAPTER_INDEX: /app/runtime/adapters/index.json
      COMIC_ENHANCER_ADAPTER_WEIGHTS_ROOT: /models/loras
      COMIC_ENHANCER_RUNTIME_DIR: /app/runtime
      COMIC_ENHANCER_WORKFLOW_FAST: /app/workflows/sd15-colorize-fast.json
      COMIC_ENHANCER_WORKFLOW_QUALITY: /app/workflows/sd15-colorize-quality.json
      COMIC_ENHANCER_WORKFLOW_REFERENCE_QUALITY: /app/workflows/manganinja-reference-quality.json
      COMIC_ENHANCER_WORKFLOW_ROOT: /app/workflows
      COMIC_ENHANCER_GITEE_ENABLED: ${COMIC_ENHANCER_GITEE_ENABLED:-true}
      COMIC_ENHANCER_GITEE_OWNER: ${COMIC_ENHANCER_GITEE_OWNER:-}
      COMIC_ENHANCER_GITEE_REPO: ${COMIC_ENHANCER_GITEE_REPO:-}
      COMIC_ENHANCER_GITEE_BRANCH: ${COMIC_ENHANCER_GITEE_BRANCH:-main}
      COMIC_ENHANCER_GITEE_TOKEN: ${COMIC_ENHANCER_GITEE_TOKEN:-}
      COMIC_ENHANCER_GITEE_INDEX_PATH: ${COMIC_ENHANCER_GITEE_INDEX_PATH:-adapters/index.json}
      COMIC_ENHANCER_GITEE_RELEASE_TAG: ${COMIC_ENHANCER_GITEE_RELEASE_TAG:-lora}
    ports:
      - "8765:8765"
    volumes:
      - comic-enhancer-runtime:/app/runtime
      - ${COMFYUI_MODELS_ROOT:-/data1/models/ComfyUI/models}:/models
      - ./workflows:/app/workflows:ro

volumes:
  comic-enhancer-runtime:
